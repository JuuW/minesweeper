<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>扫雷</h1>

    <div class="toolbar">
      <div class="level-select">
        <button class="level-btn active" data-level="easy">初级</button>
        <button class="level-btn" data-level="medium">中级</button>
        <button class="level-btn" data-level="hard">高级</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="counter" id="mine-counter">💣 0</div>
      <button class="reset-btn" id="reset-btn">🙂</button>
      <div class="counter" id="timer">⏱ 0</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <p class="hint">左键翻开 · 右键插旗</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
